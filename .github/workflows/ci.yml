name: CI

on:
  push:
    pull_request:
      branches:
       - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala o Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instala dependências
        run: npm install

      - name: Roda os testes
        run: npm test
build:
  runs-on: ubuntu-latest
  needs: tests #Com o needs criamos uma sequência, então primeiro ele roda o tests e depois este.
  steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala o Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instala dependências
        run: npm install
      - name: Roda o build
        run: npm run build