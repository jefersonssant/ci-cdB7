name: CI

on:
  push:
    pull_request:
      branches:
       - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        users: actions/checkout@v4

      - name: Instala o Node
        users: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instala dependências
        run: npm install

      - name: Roda os testes
        run: npm test